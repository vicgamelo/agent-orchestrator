# A small analyst team for Brazilian business questions.
#
#   coordinator ──► economist          (Banco Central indicators, calculator)
#               └─► company_researcher (CNPJ, CEP, business days)
#
# Providers are swappable per agent: run everything locally on Ollama, point the
# coordinator at Claude, or use free hosted tiers with a fallback chain:
#   COORDINATOR_PROVIDER=groq,openrouter  WORKER_PROVIDER=groq,openrouter
# (see .env.example for the free models that support tool calling).

providers:
  local:
    type: openai                       # any OpenAI-compatible server
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
  anthropic:
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY:-}
  groq:
    type: openai
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY:-}
    timeout_s: 30                      # fail over quickly instead of hanging a demo request
    reasoning_effort: low              # gpt-oss otherwise can spend all of max_tokens thinking
  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY:-}
    timeout_s: 60
    free_models_only: true             # a paid model id here would spend credits: refuse to start instead

mcp_servers:
  - name: brasil
    # Hosted instance; or run it locally with: command: uvx, args: [mcp-server-brasil]
    url: ${MCP_BRASIL_URL:-https://mcp.vgmelo.tech/mcp}

agents:
  - name: coordinator
    description: Plans the work, delegates to specialists and writes the final answer.
    provider: ${COORDINATOR_PROVIDER:-local}
    model: ${COORDINATOR_MODEL:-qwen3.5:9b}       # local / anthropic
    models:                                        # used when the chain includes these providers
      groq: ${GROQ_COORDINATOR_MODEL:-openai/gpt-oss-120b}
      openrouter: ${OPENROUTER_COORDINATOR_MODEL:-google/gemma-4-31b-it:free}
    delegates: [economist, company_researcher]
    tools: [current_datetime]
    max_steps: 6
    max_tokens: 4096   # reasoning models (qwen3.5, etc.) spend tokens thinking before answering
    instructions: |
      You coordinate a team of analysts. Break the user's question into independent
      sub-tasks and delegate them; call several delegates in the same turn when the
      sub-tasks don't depend on each other. Never invent numbers or sources: every figure
      in the answer must come from a delegate. If the team has no tool for the question, or
      a delegate fails, say plainly what you couldn't fetch; don't fill the gap from memory.
      Answer in the user's language, concise, citing the dates of the data.

  - name: economist
    description: Brazilian macro data (Selic, CDI, IPCA, IGP-M, USD, EUR) and calculations.
    provider: ${WORKER_PROVIDER:-local}
    model: ${WORKER_MODEL:-qwen3.5:9b}
    models:
      groq: ${GROQ_WORKER_MODEL:-openai/gpt-oss-20b}
      openrouter: ${OPENROUTER_WORKER_MODEL:-google/gemma-4-26b-a4b-it:free}
    tools: [brasil__indicador_economico, calculator]
    max_tokens: 4096
    instructions: |
      You are an economist. Fetch indicators with the tools and use the calculator for
      any arithmetic (accumulated inflation, real interest...). Always finish with a reply
      containing the numbers, their reference dates and one line of interpretation. If no
      tool covers the request, say so in one sentence instead of guessing.

  - name: company_researcher
    description: Company records by CNPJ, addresses by CEP, holidays and business days.
    provider: ${WORKER_PROVIDER:-local}
    model: ${WORKER_MODEL:-qwen3.5:9b}
    models:
      groq: ${GROQ_WORKER_MODEL:-openai/gpt-oss-20b}
      openrouter: ${OPENROUTER_WORKER_MODEL:-google/gemma-4-26b-a4b-it:free}
    tools: [brasil__consultar_cnpj, brasil__consultar_cep, brasil__validar_documento, brasil__dias_uteis]
    max_tokens: 4096
    instructions: |
      You look up public registry data. Validate documents before querying. Base every
      fact on tool results, and always finish with a short answer to the request.

default_agent: coordinator

limits:
  tool_timeout_s: 30
  run_timeout_s: 240
  max_delegation_depth: 2
  max_total_tokens: 150000
